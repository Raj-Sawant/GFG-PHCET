<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFG PHCET - Redirecting</title>
    <script>
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var repoPrefix = pathname.indexOf('/GFG-PHCET') === 0 ? '/GFG-PHCET' : '';
        var actualPath = pathname.substring(repoPrefix.length);

        window.location.replace(
          repoPrefix + '/?p=' + encodeURIComponent(actualPath + search) + hash
        );
      })();
    </script>
  </head>
  <body style="background: #06090e; color: #00b386; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="font-weight: 600; margin-bottom: 0.5rem;">Redirecting to Member Profile...</h2>
      <p style="color: #94a3b8; font-size: 0.9rem;">GeeksforGeeks PHCET Student Chapter</p>
    </div>
  </body>
</html>
